<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pet Shop ♡</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div class="login-card">

        <h2>Pet Shop</h2>

        <p class="subtitle">
            Cuide do seu melhor amigo ♡
        </p>

        <form id="loginForm" novalidate>

            <div class="input-group">
                <label for="nome">Nome do tutor</label>

                <input
                    id="nome"
                    type="text"
                    placeholder="Digite seu nome"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>

                <input
                    id="email"
                    type="email"
                    placeholder="seu@email.com"
                    required
                >
            </div>

            <div class="input-group">
                <label for="telefone">Telefone</label>

                <input
                    id="telefone"
                    type="tel"
                    placeholder="(00) 00000-0000"
                    required
                >
            </div>

            <div class="input-group">
                <label for="pet">Nome do pet</label>

                <input
                    id="pet"
                    type="text"
                    placeholder="Nome do seu pet"
                    required
                >
            </div>

            <div class="input-group">
                <label for="tipoPet">Tipo de pet</label>

                <select id="tipoPet" required>
                    <option value="">Selecione</option>
                    <option value="cachorro">🐶 Cachorro</option>
                    <option value="gato">🐱 Gato</option>
                    <option value="passaro">🐦 Pássaro</option>
                    <option value="outro">🐾 Outro</option>
                </select>
            </div>

            <div class="input-group">
                <label for="servico">Serviço desejado</label>

                <select id="servico" required>
                    <option value="">Selecione um serviço</option>
                    <option value="banho">🫧 Banho</option>
                    <option value="tosa">✂️ Tosa</option>
                    <option value="banho-tosa">🎀 Banho e Tosa</option>
                    <option value="consulta">🩺 Consulta</option>
                    <option value="hospedagem">🏠 Hospedagem</option>
                </select>
            </div>

            <button class="btn-submit" type="submit">
                Entrar ♡
            </button>

        </form>

    </div>

</body>

</html>
